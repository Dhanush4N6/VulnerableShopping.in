{% extends "base.html" %}{% block body %}
<div class=panel><h1>🔐 Login</h1>
{% if err %}<p class=error>{{err}}</p>{% endif %}
<form method=post>
  <label>Username</label><input name=u type=text required>
  <label>Password</label><input name=p type=password required>
  <br><br><button class="btn dark" style="width:100%">Sign In</button>
</form>
<p class=hint>New to VShop? <a href="/register">Create an account</a></p></div>
{% endblock %}
